<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>初始化分類</title>
  <style>
    body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
    button { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #3b82f6; color: white; border: none; border-radius: 8px; }
    button:hover { background: #2563eb; }
    button:disabled { background: #ccc; cursor: not-allowed; }
    pre { background: #f3f4f6; padding: 15px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <h1>初始化預設分類</h1>
  <p>點擊下方按鈕將預設分類（食衣住行育樂等）寫入 Firestore</p>

  <button id="initBtn" onclick="initCategories()">初始化分類</button>

  <pre id="log"></pre>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js'
    import { getFirestore, collection, writeBatch, doc, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js'
    import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js'

    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyDKGnkv51wkjMcJOPL88KxrYxUvB1hPWlI",
      authDomain: "money-track-27e32.firebaseapp.com",
      projectId: "money-track-27e32",
      storageBucket: "money-track-27e32.firebasestorage.app",
      messagingSenderId: "267711498280",
      appId: "1:267711498280:web:f9e0e0f5e5e5e5e5e5e5e5"
    }

    const DEFAULT_EXPENSE_CATEGORIES = [
      { name: '食', level: 1, children: [
        { name: '外食', level: 2, children: [
          { name: '早餐', level: 3 },
          { name: '午餐', level: 3 },
          { name: '晚餐', level: 3 },
          { name: '宵夜', level: 3 },
        ]},
        { name: '飲料', level: 2 },
        { name: '食材', level: 2 },
      ]},
      { name: '衣', level: 1 },
      { name: '住', level: 1, children: [
        { name: '房租', level: 2 },
        { name: '水電', level: 2 },
        { name: '網路', level: 2 },
        { name: '管理費', level: 2 },
      ]},
      { name: '行', level: 1, children: [
        { name: '交通', level: 2, children: [
          { name: '捷運', level: 3 },
          { name: '公車', level: 3 },
          { name: '計程車', level: 3 },
        ]},
        { name: '油費', level: 2 },
        { name: '停車', level: 2 },
      ]},
      { name: '育', level: 1, children: [
        { name: '學費', level: 2 },
        { name: '書籍', level: 2 },
        { name: '課程', level: 2 },
      ]},
      { name: '樂', level: 1, children: [
        { name: '娛樂', level: 2 },
        { name: '訂閱', level: 2 },
        { name: '旅遊', level: 2 },
      ]},
      { name: '醫療', level: 1 },
      { name: '其他', level: 1 },
    ]

    const DEFAULT_INCOME_CATEGORIES = [
      { name: '薪資', level: 1, children: [
        { name: '本薪', level: 2 },
        { name: '獎金', level: 2 },
        { name: '加班費', level: 2 },
      ]},
      { name: '投資', level: 1, children: [
        { name: '股票', level: 2 },
        { name: '基金', level: 2 },
        { name: '利息', level: 2 },
      ]},
      { name: '副業', level: 1 },
      { name: '其他', level: 1 },
    ]

    const logEl = document.getElementById('log')
    const btn = document.getElementById('initBtn')

    function log(msg, type = '') {
      const span = document.createElement('span')
      span.className = type
      span.textContent = msg + '\n'
      logEl.appendChild(span)
      logEl.scrollTop = logEl.scrollHeight
    }

    window.initCategories = async function() {
      btn.disabled = true
      logEl.textContent = ''

      try {
        log('初始化 Firebase...')
        const app = initializeApp(firebaseConfig)
        const db = getFirestore(app)
        const auth = getAuth(app)

        log('匿名登入中...')
        const userCredential = await signInAnonymously(auth)
        const uid = userCredential.user.uid
        log('登入成功，UID: ' + uid, 'success')

        const categoriesRef = collection(db, 'users', uid, 'categories')

        log('檢查現有分類...')
        const existing = await getDocs(categoriesRef)
        if (!existing.empty) {
          log('已有 ' + existing.size + ' 個分類', 'error')
          log('如需重新初始化，請先在 Firebase Console 刪除分類')
          btn.disabled = false
          return
        }

        log('建立預設分類...')
        const batch = writeBatch(db)
        let order = 0

        const addCategoryTree = (items, type, parentId = null) => {
          items.forEach((item) => {
            const docRef = doc(categoriesRef)
            batch.set(docRef, {
              name: item.name,
              type,
              parentId,
              level: item.level,
              order: order++
            })
            log('  ' + type + ' - ' + '  '.repeat(item.level - 1) + item.name)

            if (item.children) {
              addCategoryTree(item.children, type, docRef.id)
            }
          })
        }

        log('\n支出分類:')
        addCategoryTree(DEFAULT_EXPENSE_CATEGORIES, 'expense')

        log('\n收入分類:')
        addCategoryTree(DEFAULT_INCOME_CATEGORIES, 'income')

        await batch.commit()
        log('\n✅ 預設分類已建立完成！總共 ' + order + ' 個分類', 'success')
        log('\n現在可以關閉此頁面，重新整理 App 即可看到分類', 'success')

      } catch (error) {
        log('❌ 錯誤: ' + error.message, 'error')
        console.error(error)
        btn.disabled = false
      }
    }
  </script>
</body>
</html>
