<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="notebookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d1fae5"/>
      <stop offset="100%" style="stop-color:#a7f3d0"/>
    </linearGradient>
    <linearGradient id="walletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="96" cy="96" r="90" fill="#fef7f0"/>

  <!-- Notebook binding -->
  <rect x="28" y="50" width="18" height="100" rx="4" fill="#5eead4"/>
  <circle cx="37" cy="65" r="4" fill="#2dd4bf"/>
  <circle cx="37" cy="85" r="4" fill="#2dd4bf"/>
  <circle cx="37" cy="105" r="4" fill="#2dd4bf"/>
  <circle cx="37" cy="125" r="4" fill="#2dd4bf"/>

  <!-- Notebook body -->
  <rect x="40" y="50" width="75" height="100" rx="8" fill="url(#notebookGrad)"/>

  <!-- Receipt -->
  <path d="M55 35 L100 35 L100 60 L55 60 Z" fill="#fff" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M55 35 L58 30 L61 35 L64 30 L67 35 L70 30 L73 35 L76 30 L79 35 L82 30 L85 35 L88 30 L91 35 L94 30 L97 35 L100 30 L100 35 Z" fill="#fff"/>
  <text x="77" y="52" font-family="Arial" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">$</text>
  <line x1="60" y1="42" x2="90" y2="42" stroke="#d1d5db" stroke-width="2"/>
  <line x1="60" y1="48" x2="85" y2="48" stroke="#d1d5db" stroke-width="2"/>

  <!-- Notebook face -->
  <circle cx="62" cy="95" r="5" fill="#1f2937"/>
  <circle cx="82" cy="95" r="5" fill="#1f2937"/>
  <circle cx="63" cy="93" r="2" fill="#fff"/>
  <circle cx="83" cy="93" r="2" fill="#fff"/>
  <path d="M65 108 Q72 115 80 108" stroke="#1f2937" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Blush -->
  <ellipse cx="55" cy="105" rx="6" ry="4" fill="#fecaca" opacity="0.6"/>
  <ellipse cx="90" cy="105" rx="6" ry="4" fill="#fecaca" opacity="0.6"/>

  <!-- Notebook lines -->
  <line x1="50" y1="125" x2="105" y2="125" stroke="#d1d5db" stroke-width="2"/>
  <line x1="50" y1="135" x2="100" y2="135" stroke="#d1d5db" stroke-width="2"/>

  <!-- Wallet -->
  <rect x="115" y="105" width="50" height="40" rx="6" fill="url(#walletGrad)"/>
  <rect x="115" y="105" width="50" height="12" rx="6" fill="#a78bfa"/>
  <circle cx="155" cy="130" r="5" fill="#fbbf24"/>
  <rect x="120" y="100" width="35" height="8" rx="2" fill="#6ee7b7"/>

  <!-- Coin -->
  <circle cx="50" cy="145" r="20" fill="#fbbf24"/>
  <circle cx="50" cy="145" r="16" fill="#fcd34d"/>
  <text x="50" y="152" font-family="Arial" font-size="20" font-weight="bold" fill="#d97706" text-anchor="middle">$</text>

  <!-- Chart bubble -->
  <circle cx="145" cy="70" r="22" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="132" y="72" width="8" height="15" rx="2" fill="#5eead4"/>
  <rect x="142" y="62" width="8" height="25" rx="2" fill="#fbbf24"/>
  <rect x="152" y="67" width="8" height="20" rx="2" fill="#f87171"/>
</svg>
