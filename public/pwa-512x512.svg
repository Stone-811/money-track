  <path d="M147 93 L155 80 L163 93 L171 80 L179 93 L187 80 L195 93 L203 80 L211 93 L219 80 L227 93 L235 80 L243 93 L251 80 L259 93 L267 80 L267 93 Z" fill="#fff"/>
